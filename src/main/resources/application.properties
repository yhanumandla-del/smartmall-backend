spring.application.name=smartmall
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartmall?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:SmartMallAcademicSecretKeyChangeBeforeProduction1234567890}
app.jwt.expiration-ms=86400000
# Comma-separated list of frontend origins allowed by CORS (wildcards like https://*.vercel.app are supported)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app,https://transcendent-parfait-dc56df.netlify.app}
server.error.include-message=always

# Password reset
# Public URL of the deployed frontend (used to build the link in the reset email, no trailing slash)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.reset.expiry-minutes=30
# Email via the Brevo HTTPS API. If these are empty, the reset link is only written to the server log.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:SmartMall}
